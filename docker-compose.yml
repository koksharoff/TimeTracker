# Local setup: PostgreSQL + backend API + dashboard.
# Host ports can be overridden via environment variables or a .env file next to this file,
# e.g. FRONTEND_PORT=8088 DB_PORT=5433 docker compose up --build
services:
  db:
    image: postgres:16-alpine
    container_name: time-tracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: time_tracker
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runtime
    image: time-tracker-backend:latest
    container_name: time-tracker-backend
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/time_tracker?schema=public
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}
      # Optional: raises GitHub API rate limits for avatars / commit counts.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: time-tracker-frontend:latest
    container_name: time-tracker-frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:80'
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  db_data:
